name: CI

on:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test all projects
        run: pnpm nx run-many -t typecheck lint test

      - name: Verify restricted-imports lint rules fire
        run: node packages/protocol/scripts/verify-lint-rules.mjs
