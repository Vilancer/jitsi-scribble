name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test all projects
        run: pnpm nx run-many -t typecheck lint test

      - name: Verify restricted-imports lint rules fire
        run: node packages/protocol/scripts/verify-lint-rules.mjs

      - name: Verify the publish shape against a local registry
        run: node packages/protocol/scripts/verify-publish-shape.mjs

      - name: Run the cross-subpath resolution smoke test
        run: node --experimental-strip-types apps/example/src/main.ts

  # Tag-triggered release job (PKG-07's release-gating half). Runs the
  # identical typecheck/lint/test step set first — the AND of all three
  # gates the publish step below, independent of the pull_request job's
  # completion (they're separate jobs on separate triggers) so a release
  # never skips verification even if this push isn't also a pull_request.
  #
  # A re-run against an already-published version does NOT fail loudly —
  # verified against the real registry on 2026-08-04. `nx release publish`
  # pre-checks the registry itself and gracefully SKIPS
  # ("Skipped package ... because vX.Y.Z already exists ...") with a
  # green job, before ever calling `npm publish`. This supersedes
  # T-02-04-02's original "fails loudly" assumption, which was never
  # exercised against a real registry. The graceful skip is Nx's actual,
  # intended design — it's what makes re-running a release workflow safe —
  # and combined with the `concurrency` group below it still fully
  # mitigates the duplicate/race threat T-02-04-02 was written against,
  # just via a no-op rather than an error.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and test all projects
        run: pnpm nx run-many -t typecheck lint test

      - name: Verify restricted-imports lint rules fire
        run: node packages/protocol/scripts/verify-lint-rules.mjs

      - name: Verify the publish shape against a local registry
        run: node packages/protocol/scripts/verify-publish-shape.mjs

      # Only reached if every step above succeeded — the logical AND this
      # plan's must-have truth requires. Registry/auth token come from a
      # repo secret (NPM_TOKEN), never hardcoded and never this plan's own
      # local-verdaccio testing script.
      # NPM_CONFIG_PROVENANCE currently has NO EFFECT — verified against a
      # real publish on 2026-08-04. `nx release publish` shells out to
      # `pnpm publish`, and while pnpm's config loader does parse this env
      # var into a `provenance: true` setting, the pnpm 11.17.0 CLI has no
      # Sigstore/OIDC signing implementation behind that setting: it's
      # accepted and silently ignored. Known upstream gap, not a config
      # mistake here: https://github.com/pnpm/pnpm/issues/6607. The
      # `id-token: write` permission above is necessary but not sufficient
      # while publishing goes through pnpm. Revisit if pnpm ships real
      # support, or switch this one step to `npm publish --provenance`
      # (npm's CLI has full support today) if provenance becomes a hard
      # requirement before then.
      - name: Publish (nx release publish)
        run: pnpm nx release publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
